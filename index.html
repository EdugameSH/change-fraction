<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>분수 대결!</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --p1:#E84393;--p1l:#FBEAF0;--p1d:#72243E;
  --p2:#1D9E75;--p2l:#E1F5EE;--p2d:#085041;
  --p3:#378ADD;--p3l:#E6F1FB;--p3d:#0C447C;
  --p4:#EF9F27;--p4l:#FAEEDA;--p4d:#633806;
  --bg:#F8F7F2;--card:#fff;--border:#D3D1C7;
  --text:#2C2C2A;--muted:#888780;
}
html,body{height:100%;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
#app{min-height:100vh;display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.screen.active{display:flex}

#start-screen{gap:18px;background:linear-gradient(135deg,#fff9f0 0%,#f0f8ff 100%)}
.game-title{font-family:'Gaegu',cursive;font-size:clamp(26px,5vw,52px);font-weight:700;text-align:center;line-height:1.2}
.game-title span{display:block;font-size:clamp(14px,2.5vw,24px);color:var(--muted);font-weight:400;margin-top:4px}
.animal-row{display:flex;gap:16px;font-size:clamp(28px,5vw,48px)}
.info-box{font-size:clamp(12px,1.8vw,15px);color:var(--muted);text-align:center;line-height:2;max-width:380px}
.start-btn{font-family:'Noto Sans KR',sans-serif;font-size:clamp(16px,2.5vw,24px);font-weight:700;padding:12px 44px;border-radius:50px;border:none;cursor:pointer;background:var(--text);color:#fff;transition:transform .1s,opacity .1s}
.start-btn:hover{opacity:.85}
.start-btn:active{transform:scale(.97)}

#game-screen{padding:8px 6px 8px;gap:0;justify-content:flex-start;background:var(--bg);min-height:100vh;height:100vh}
.top-bar{width:100%;padding:0 4px 6px;flex-shrink:0}
#timer-text{font-size:clamp(22px,4vw,36px);font-weight:900;text-align:center;letter-spacing:3px;color:var(--text);margin-bottom:4px}
.timer-track{width:100%;height:12px;background:#D3D1C7;border-radius:8px;overflow:hidden}
.timer-fill{height:100%;border-radius:8px;background:#1D9E75;transition:width .5s linear,background .5s}

.players-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;flex:1;min-height:0}
.player-panel{border-radius:14px;border:2.5px solid;overflow:hidden;display:flex;flex-direction:column;background:var(--card);height:100%}
.pc1{border-color:var(--p1)}.pc2{border-color:var(--p2)}.pc3{border-color:var(--p3)}.pc4{border-color:var(--p4)}

.panel-flash-correct{animation:flashGreen .7s ease-out}
.panel-flash-wrong{animation:flashRed .7s ease-out}
@keyframes flashGreen{0%,20%{background:#a8d5b5}100%{background:var(--card)}}
@keyframes flashRed{0%,20%{background:#f0a8ad}100%{background:var(--card)}}

.player-header{display:flex;flex-direction:column;align-items:center;padding:8px 6px 6px;font-weight:700;flex-shrink:0;position:relative}
.pc1 .player-header{background:var(--p1l);color:var(--p1d)}
.pc2 .player-header{background:var(--p2l);color:var(--p2d)}
.pc3 .player-header{background:var(--p3l);color:var(--p3d)}
.pc4 .player-header{background:var(--p4l);color:var(--p4d)}
.animal-emoji{font-size:clamp(20px,3vw,34px);line-height:1}
.animal-name{font-size:clamp(10px,1.4vw,14px);font-weight:700;margin-top:2px}
.pc1 .player-score{color:var(--p1)}.pc2 .player-score{color:var(--p2)}.pc3 .player-score{color:var(--p3)}.pc4 .player-score{color:var(--p4)}
.player-score{font-size:clamp(13px,2vw,20px);font-weight:900;margin-top:2px}

.combo-badge{display:inline-flex;align-items:center;gap:3px;margin-top:4px;padding:2px 8px;border-radius:20px;font-size:clamp(10px,1.4vw,13px);font-weight:900;min-height:20px;transition:transform .15s}
.combo-badge.hidden{visibility:hidden}
.combo-badge.pop{animation:comboPop .25s ease-out}
@keyframes comboPop{0%{transform:scale(1.5)}100%{transform:scale(1)}}
.pc1 .combo-badge{background:var(--p1);color:#fff}
.pc2 .combo-badge{background:var(--p2);color:#fff}
.pc3 .combo-badge{background:var(--p3);color:#fff}
.pc4 .combo-badge{background:var(--p4);color:#fff}

.score-popup{position:absolute;top:6px;right:8px;font-size:clamp(12px,1.8vw,16px);font-weight:900;pointer-events:none;animation:scoreFloat .9s ease-out forwards;opacity:0}
@keyframes scoreFloat{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-28px)}}

.player-body{padding:10px 8px;flex:1;display:flex;flex-direction:column;min-height:0}
.question-box{text-align:center;padding:12px 4px;border-radius:10px;font-weight:900;flex-shrink:0}
.pc1 .question-box{background:var(--p1l);color:var(--p1d)}
.pc2 .question-box{background:var(--p2l);color:var(--p2d)}
.pc3 .question-box{background:var(--p3l);color:var(--p3d)}
.pc4 .question-box{background:var(--p4l);color:var(--p4d)}

.mixed-num{display:inline-flex;align-items:center;gap:6px;font-size:clamp(22px,3.5vw,38px);font-weight:900;vertical-align:middle;line-height:1}
.whole-part{font-size:1em}
.frac-inline{display:inline-flex;flex-direction:column;align-items:center;gap:0;font-size:.9em;line-height:1.15}
.frac-top{display:block;text-align:center}
.frac-bar{display:block;width:100%;min-width:1em;height:2.5px;background:currentColor;border-radius:1px}
.frac-bot{display:block;text-align:center}

.spacer{flex:1}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex-shrink:0}
.choice-btn{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:clamp(15px,2.2vw,20px);padding:8px 4px;border-radius:9px;border:2px solid;cursor:pointer;transition:transform .1s;background:#fff;display:flex;align-items:center;justify-content:center;min-height:46px}
.choice-btn:active{transform:scale(.93)}
.choice-btn.correct{background:#EAF3DE !important;border-color:#639922 !important;color:#3B6D11 !important}
.choice-btn.wrong{background:#FCEBEB !important;border-color:#A32D2D !important;color:#791F1F !important}
.choice-btn.locked{cursor:default;pointer-events:none}
.pc1 .choice-btn{border-color:var(--p1);color:var(--p1d)}.pc1 .choice-btn:hover{background:var(--p1l)}
.pc2 .choice-btn{border-color:var(--p2);color:var(--p2d)}.pc2 .choice-btn:hover{background:var(--p2l)}
.pc3 .choice-btn{border-color:var(--p3);color:var(--p3d)}.pc3 .choice-btn:hover{background:var(--p3l)}
.pc4 .choice-btn{border-color:var(--p4);color:var(--p4d)}.pc4 .choice-btn:hover{background:var(--p4l)}

.choice-frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.2;gap:0}
.choice-frac-top{display:block;text-align:center}
.choice-frac-bar{display:block;width:100%;min-width:1.1em;height:2px;background:currentColor;border-radius:1px}
.choice-frac-bot{display:block;text-align:center}

#result-screen{background:linear-gradient(135deg,#fff9f0 0%,#f0f8ff 100%);gap:16px}
.result-title{font-family:'Gaegu',cursive;font-size:clamp(28px,6vw,56px);font-weight:700;text-align:center}
.winner-box{text-align:center;padding:18px 28px;border-radius:20px;border:3px solid;font-size:clamp(16px,3vw,26px);font-weight:900}
.rankings{display:flex;flex-direction:column;gap:8px;width:100%;max-width:440px}
.rank-row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:10px 16px;border:1.5px solid var(--border)}
.rank-num{font-weight:900;font-size:20px;width:28px;text-align:center}
.rank-name{flex:1;font-weight:700;font-size:15px}
.rank-score{font-weight:900;font-size:20px}
.restart-btn{font-family:'Noto Sans KR',sans-serif;font-size:17px;font-weight:700;padding:12px 40px;border-radius:50px;border:none;cursor:pointer;background:var(--text);color:#fff}
.restart-btn:hover{opacity:.85}
.restart-btn:active{transform:scale(.97)}
</style>
</head>
<body>
<div id="app">

<div id="start-screen" class="screen active">
  <div class="game-title">🔢 분수 대결!<span>대분수 → 가분수 변환 게임</span></div>
  <div class="animal-row">🐹 🐰 🐶 🐱</div>
  <div class="info-box">
    ⏱ 제한시간 <b>1분</b> &nbsp;|&nbsp; 정답 <b style="color:#1D9E75">+10점</b> &nbsp;|&nbsp; 오답 <b style="color:#E24B4A">-10점</b><br>
    🔥 연속 정답 시 콤보 보너스! (2콤보=20점, 3콤보=30점…)
  </div>
  <button class="start-btn" onclick="startGame()">게임 시작!</button>
</div>

<div id="game-screen" class="screen">
  <div class="top-bar">
    <div id="timer-text">1:00</div>
    <div class="timer-track"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
  </div>
  <div class="players-row" id="players-row"></div>
</div>

<div id="result-screen" class="screen">
  <div class="result-title">⏰ 시간 종료!</div>
  <div class="winner-box" id="winner-box"></div>
  <div class="rankings" id="rankings"></div>
  <button class="restart-btn" onclick="goStart()">다시 하기</button>
</div>

</div>

<script>
const ANIMALS=[
  {emoji:'🐹',name:'햄스터',cls:'pc1',idx:0},
  {emoji:'🐰',name:'토끼',cls:'pc2',idx:1},
  {emoji:'🐶',name:'강아지',cls:'pc3',idx:2},
  {emoji:'🐱',name:'고양이',cls:'pc4',idx:3}
];
const TOTAL_SEC=60;
const COLORS=[['var(--p1)','var(--p1l)','var(--p1d)'],['var(--p2)','var(--p2l)','var(--p2d)'],['var(--p3)','var(--p3l)','var(--p3d)'],['var(--p4)','var(--p4l)','var(--p4d)']];
let state={};let audioCtx=null;

function getAudioCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playCorrect(combo){
  try{
    const ctx=getAudioCtx(),now=ctx.currentTime;
    const base=combo>=3?600:combo===2?560:523.25;
    [[base,0],[base*1.26,.1],[base*1.5,.2],[base*2,.3]].forEach(([f,t])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sine';o.frequency.value=f;
      const vol=Math.min(0.1+combo*0.04,0.35);
      g.gain.setValueAtTime(0,now+t);g.gain.linearRampToValueAtTime(vol,now+t+.04);g.gain.exponentialRampToValueAtTime(.001,now+t+.28);
      o.start(now+t);o.stop(now+t+.32);
    });
  }catch(e){}
}
function playWrong(){
  try{
    const ctx=getAudioCtx(),now=ctx.currentTime;
    [[220,0,.18],[196,.2,.18]].forEach(([f,t,d])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sawtooth';o.frequency.value=f;
      g.gain.setValueAtTime(0,now+t);g.gain.linearRampToValueAtTime(.18,now+t+.03);g.gain.exponentialRampToValueAtTime(.001,now+t+d);
      o.start(now+t);o.stop(now+t+d+.05);
    });
  }catch(e){}
}

function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function genQuestion(usedDenoms){
  let denom,tries=0;
  do{denom=randInt(2,13);tries++;}while(usedDenoms.has(denom)&&tries<30);
  usedDenoms.add(denom);
  const whole=randInt(1,9),numer=randInt(1,denom-1),correctNumer=whole*denom+numer;
  const wrongs=new Set();let att=0;
  while(wrongs.size<3&&att<50){att++;const w=correctNumer+randInt(1,8)*(Math.random()<.5?1:-1);if(w>0&&w!==correctNumer)wrongs.add(w);}
  const choices=[correctNumer,...wrongs];
  for(let i=choices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[choices[i],choices[j]]=[choices[j],choices[i]];}
  return{whole,numer,denom,correctNumer,choices};
}

function mixedHTML(q){
  return`<span class="mixed-num"><span class="whole-part">${q.whole}</span><span class="frac-inline"><span class="frac-top">${q.numer}</span><span class="frac-bar"></span><span class="frac-bot">${q.denom}</span></span></span>`;
}
function choiceFracHTML(num,denom){
  return`<span class="choice-frac"><span class="choice-frac-top">${num}</span><span class="choice-frac-bar"></span><span class="choice-frac-bot">${denom}</span></span>`;
}
function comboLabel(c){
  const fires=c>=5?'🔥🔥🔥':c>=3?'🔥🔥':'🔥';
  return`${fires} ${c}콤보`;
}

function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

function startGame(){
  const usedDenoms=new Set();
  state={
    scores:[0,0,0,0],
    combos:[0,0,0,0],
    questions:ANIMALS.map(()=>genQuestion(usedDenoms)),
    locked:[false,false,false,false],
    timeLeft:TOTAL_SEC,
    usedDenoms,
    timerInterval:null
  };
  renderPlayers();showScreen('game-screen');runTimer();
}

function renderPlayers(){
  const row=document.getElementById('players-row');row.innerHTML='';
  ANIMALS.forEach((a,i)=>{
    const q=state.questions[i];
    const div=document.createElement('div');
    div.className='player-panel '+a.cls;div.id='panel-'+i;
    div.innerHTML=`
      <div class="player-header">
        <span class="animal-emoji">${a.emoji}</span>
        <span class="animal-name">${a.name}</span>
        <span class="player-score" id="score-${i}">${state.scores[i]}점</span>
        <span class="combo-badge hidden" id="combo-${i}"></span>
      </div>
      <div class="player-body">
        <div class="question-box" id="qbox-${i}">${mixedHTML(q)}</div>
        <div class="spacer"></div>
        <div class="choices" id="choices-${i}">${buildChoices(q,i)}</div>
      </div>`;
    row.appendChild(div);
  });
}

function buildChoices(q,pi){
  return q.choices.map(c=>`<button class="choice-btn" onclick="answer(${pi},${c},${q.correctNumer})">${choiceFracHTML(c,q.denom)}</button>`).join('');
}

function updateComboUI(pi){
  const c=state.combos[pi];
  const el=document.getElementById('combo-'+pi);
  if(c>=2){
    el.textContent=comboLabel(c);
    el.classList.remove('hidden','pop');
    void el.offsetWidth;
    el.classList.add('pop');
  }else{
    el.classList.add('hidden');
  }
}

function showScorePopup(pi,points){
  const header=document.querySelector('#panel-'+pi+' .player-header');
  const pop=document.createElement('span');
  pop.className='score-popup';
  pop.textContent='+'+points;
  pop.style.color=COLORS[pi][0];
  header.appendChild(pop);
  setTimeout(()=>pop.remove(),950);
}

function answer(pi,chosen,correct){
  if(state.locked[pi])return;
  state.locked[pi]=true;
  const isCorrect=chosen===correct;

  if(isCorrect){
    state.combos[pi]++;
    const points=state.combos[pi]*10;
    state.scores[pi]+=points;
    showScorePopup(pi,points);
  }else{
    state.combos[pi]=0;
    state.scores[pi]=Math.max(0,state.scores[pi]-10);
  }

  document.getElementById('score-'+pi).textContent=state.scores[pi]+'점';
  updateComboUI(pi);

  const panel=document.getElementById('panel-'+pi);
  panel.classList.remove('panel-flash-correct','panel-flash-wrong');
  void panel.offsetWidth;
  panel.classList.add(isCorrect?'panel-flash-correct':'panel-flash-wrong');
  if(isCorrect)playCorrect(state.combos[pi]);else playWrong();

  document.querySelectorAll('#choices-'+pi+' .choice-btn').forEach(btn=>{
    const topEl=btn.querySelector('.choice-frac-top');if(!topEl)return;
    const bVal=parseInt(topEl.textContent);
    btn.classList.add('locked');
    if(bVal===correct)btn.classList.add('correct');
    else if(bVal===chosen&&!isCorrect)btn.classList.add('wrong');
  });

  setTimeout(()=>{
    if(state.timeLeft>0){
      state.locked[pi]=false;
      panel.classList.remove('panel-flash-correct','panel-flash-wrong');
      const usedDenoms=new Set(state.questions.filter((_,idx)=>idx!==pi).map(q=>q.denom));
      state.questions[pi]=genQuestion(usedDenoms);
      document.getElementById('qbox-'+pi).innerHTML=mixedHTML(state.questions[pi]);
      document.getElementById('choices-'+pi).innerHTML=buildChoices(state.questions[pi],pi);
    }
  },800);
}

function runTimer(){
  updateTimerUI();
  state.timerInterval=setInterval(()=>{state.timeLeft--;updateTimerUI();if(state.timeLeft<=0){clearInterval(state.timerInterval);endGame();}},1000);
}
function updateTimerUI(){
  const t=state.timeLeft,m=Math.floor(t/60),s=(t%60).toString().padStart(2,'0');
  document.getElementById('timer-text').textContent=m+':'+s;
  const fill=document.getElementById('timer-fill');
  fill.style.width=(t/TOTAL_SEC*100)+'%';
  fill.style.background=t>20?'#1D9E75':t>8?'#EF9F27':'#E24B4A';
  document.getElementById('timer-text').style.color=t<=8?'#E24B4A':'var(--text)';
}
function endGame(){
  state.locked=[true,true,true,true];
  const sorted=ANIMALS.map((a,i)=>({...a,score:state.scores[i]})).sort((a,b)=>b.score-a.score);
  const winner=sorted[0],wc=COLORS[winner.idx];
  const wBox=document.getElementById('winner-box');
  wBox.style.cssText=`background:${wc[1]};border-color:${wc[0]};color:${wc[2]}`;
  const tied=sorted.filter(p=>p.score===winner.score);
  wBox.innerHTML=tied.length>1
    ?'🏆 공동 우승!<br>'+tied.map(p=>p.emoji+' '+p.name).join(' & ')+'<br><span style="font-size:.7em">'+winner.score+'점</span>'
    :'🏆 우승!<br>'+winner.emoji+' '+winner.name+'<br><span style="font-size:.7em">'+winner.score+'점</span>';
  const medals=['🥇','🥈','🥉','4️⃣'];
  document.getElementById('rankings').innerHTML=sorted.map((p,ri)=>`
    <div class="rank-row">
      <span class="rank-num">${medals[ri]}</span>
      <span class="rank-name">${p.emoji} ${p.name}</span>
      <span class="rank-score" style="color:${COLORS[p.idx][0]}">${p.score}점</span>
    </div>`).join('');
  showScreen('result-screen');
}
function goStart(){showScreen('start-screen');}
</script>
</body>
</html>
