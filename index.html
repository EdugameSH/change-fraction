
<style>
@import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --p1:#E84393;--p1l:#FBEAF0;--p1d:#72243E;
  --p2:#1D9E75;--p2l:#E1F5EE;--p2d:#085041;
  --p3:#378ADD;--p3l:#E6F1FB;--p3d:#0C447C;
  --p4:#EF9F27;--p4l:#FAEEDA;--p4d:#633806;
  --bg:#F8F7F2;--card:#fff;--border:#D3D1C7;
  --text:#2C2C2A;--muted:#888780;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.screen.active{display:flex}

/* START */
#start-screen{gap:18px;background:linear-gradient(135deg,#fff9f0 0%,#f0f8ff 100%)}
.game-title{font-family:'Gaegu',cursive;font-size:clamp(26px,5vw,52px);font-weight:700;text-align:center;line-height:1.2}
.game-title span{display:block;font-size:clamp(14px,2.5vw,24px);color:var(--muted);font-weight:400;margin-top:4px}
.animal-row{display:flex;gap:16px;font-size:clamp(28px,5vw,48px)}
.info-box{font-size:clamp(12px,1.8vw,15px);color:var(--muted);text-align:center;line-height:2;max-width:380px}
.start-btn{font-family:'Noto Sans KR',sans-serif;font-size:clamp(16px,2.5vw,24px);font-weight:700;padding:12px 44px;border-radius:50px;border:none;cursor:pointer;background:var(--text);color:#fff;transition:transform .1s,opacity .1s}
.start-btn:hover{opacity:.85}
.start-btn:active{transform:scale(.97)}

/* GAME */
#game-screen{padding:8px 6px;gap:0;justify-content:flex-start;background:var(--bg)}
.top-bar{width:100%;max-width:100%;padding:0 4px 6px}
#timer-text{font-size:clamp(22px,4vw,36px);font-weight:900;text-align:center;letter-spacing:3px;color:var(--text);margin-bottom:4px}
.timer-track{width:100%;height:12px;background:#D3D1C7;border-radius:8px;overflow:hidden}
.timer-fill{height:100%;border-radius:8px;background:#1D9E75;transition:width .5s linear,background .5s}

.players-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;flex:1}
.player-panel{border-radius:14px;border:2.5px solid;overflow:hidden;display:flex;flex-direction:column;transition:background-color .15s}
.pc1{border-color:var(--p1)}
.pc2{border-color:var(--p2)}
.pc3{border-color:var(--p3)}
.pc4{border-color:var(--p4)}

.panel-flash-correct{animation:flashGreen .7s ease-out}
.panel-flash-wrong{animation:flashRed .7s ease-out}
@keyframes flashGreen{0%{background:#d4edda}30%{background:#a8d5b5}100%{background:var(--card)}}
@keyframes flashRed{0%{background:#f8d7da}30%{background:#f0a8ad}100%{background:var(--card)}}

.player-header{display:flex;flex-direction:column;align-items:center;padding:8px 6px 6px;font-weight:700}
.pc1 .player-header{background:var(--p1l);color:var(--p1d)}
.pc2 .player-header{background:var(--p2l);color:var(--p2d)}
.pc3 .player-header{background:var(--p3l);color:var(--p3d)}
.pc4 .player-header{background:var(--p4l);color:var(--p4d)}
.animal-emoji{font-size:clamp(22px,3.5vw,38px);line-height:1}
.animal-name{font-size:clamp(10px,1.5vw,14px);font-weight:700;margin-top:2px}
.player-score{font-size:clamp(14px,2vw,20px);font-weight:900;margin-top:2px}
.pc1 .player-score{color:var(--p1)}
.pc2 .player-score{color:var(--p2)}
.pc3 .player-score{color:var(--p3)}
.pc4 .player-score{color:var(--p4)}

.player-body{padding:8px 6px;flex:1;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.question-box{text-align:center;padding:8px 4px;border-radius:10px;font-weight:900;font-size:clamp(18px,3vw,32px);line-height:1.1}
.pc1 .question-box{background:var(--p1l);color:var(--p1d)}
.pc2 .question-box{background:var(--p2l);color:var(--p2d)}
.pc3 .question-box{background:var(--p3l);color:var(--p3d)}
.pc4 .question-box{background:var(--p4l);color:var(--p4d)}
.mixed-num{display:inline-flex;align-items:center;gap:4px}
.frac-stack{display:inline-flex;flex-direction:column;align-items:center;gap:1px;font-size:0.6em}
.frac-line{width:100%;height:2px;border-radius:1px;background:currentColor}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.choice-btn{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:clamp(13px,2vw,18px);padding:7px 4px;border-radius:9px;border:2px solid;cursor:pointer;transition:transform .1s,opacity .1s;background:#fff;display:flex;align-items:center;justify-content:center;min-height:40px}
.choice-btn:active{transform:scale(.93)}
.choice-btn.correct{background:#EAF3DE !important;border-color:#639922 !important;color:#3B6D11 !important}
.choice-btn.wrong{background:#FCEBEB !important;border-color:#A32D2D !important;color:#791F1F !important}
.choice-btn.locked{cursor:default;pointer-events:none}
.pc1 .choice-btn{border-color:var(--p1);color:var(--p1d)}
.pc2 .choice-btn{border-color:var(--p2);color:var(--p2d)}
.pc3 .choice-btn{border-color:var(--p3);color:var(--p3d)}
.pc4 .choice-btn{border-color:var(--p4);color:var(--p4d)}
.pc1 .choice-btn:hover{background:var(--p1l)}
.pc2 .choice-btn:hover{background:var(--p2l)}
.pc3 .choice-btn:hover{background:var(--p3l)}
.pc4 .choice-btn:hover{background:var(--p4l)}

/* RESULT */
#result-screen{background:linear-gradient(135deg,#fff9f0 0%,#f0f8ff 100%);gap:16px}
.result-title{font-family:'Gaegu',cursive;font-size:clamp(28px,6vw,56px);font-weight:700;text-align:center}
.winner-box{text-align:center;padding:18px 28px;border-radius:20px;border:3px solid;font-size:clamp(16px,3vw,26px);font-weight:900}
.rankings{display:flex;flex-direction:column;gap:8px;width:100%;max-width:440px}
.rank-row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:10px 16px;border:1.5px solid var(--border)}
.rank-num{font-weight:900;font-size:20px;width:28px;text-align:center}
.rank-name{flex:1;font-weight:700;font-size:15px}
.rank-score{font-weight:900;font-size:20px}
.restart-btn{font-family:'Noto Sans KR',sans-serif;font-size:17px;font-weight:700;padding:12px 40px;border-radius:50px;border:none;cursor:pointer;background:var(--text);color:#fff}
.restart-btn:hover{opacity:.85}
.restart-btn:active{transform:scale(.97)}
</style>

<h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">대분수를 가분수로 바꾸는 4인 동시 플레이 수학 게임</h2>

<div id="app">
<div id="start-screen" class="screen active">
  <div class="game-title">🔢 분수 대결!<span>대분수 → 가분수 변환 게임</span></div>
  <div class="animal-row">🐹 🐰 🐶 🐱</div>
  <div class="info-box">
    ⏱ 제한시간 <b>1분</b> &nbsp;|&nbsp; 정답 <b style="color:#1D9E75">+10점</b> &nbsp;|&nbsp; 오답 <b style="color:#E24B4A">-10점</b><br>
    4명이 옆으로 나란히 동시 플레이!<br>가장 높은 점수가 우승 🏆
  </div>
  <button class="start-btn" onclick="startGame()">게임 시작!</button>
</div>

<div id="game-screen" class="screen">
  <div class="top-bar">
    <div id="timer-text">1:00</div>
    <div class="timer-track"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
  </div>
  <div class="players-row" id="players-row"></div>
</div>

<div id="result-screen" class="screen">
  <div class="result-title">⏰ 시간 종료!</div>
  <div class="winner-box" id="winner-box"></div>
  <div class="rankings" id="rankings"></div>
  <button class="restart-btn" onclick="goStart()">다시 하기</button>
</div>
</div>

<script>
const ANIMALS=[
  {emoji:'🐹',name:'햄스터',cls:'pc1',idx:0},
  {emoji:'🐰',name:'토끼',cls:'pc2',idx:1},
  {emoji:'🐶',name:'강아지',cls:'pc3',idx:2},
  {emoji:'🐱',name:'고양이',cls:'pc4',idx:3}
];
const TOTAL_SEC=60;
const COLORS=[['var(--p1)','var(--p1l)','var(--p1d)'],['var(--p2)','var(--p2l)','var(--p2d)'],['var(--p3)','var(--p3l)','var(--p3d)'],['var(--p4)','var(--p4l)','var(--p4d)']];
let state={};
let audioCtx=null;

function getAudioCtx(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

function playCorrect(){
  try{
    const ctx=getAudioCtx();
    const now=ctx.currentTime;
    [[523.25,0],[659.25,.12],[783.99,.22],[1046.5,.32]].forEach(([f,t])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,now+t);
      g.gain.linearRampToValueAtTime(0.22,now+t+0.04);
      g.gain.exponentialRampToValueAtTime(0.001,now+t+0.25);
      o.start(now+t);o.stop(now+t+0.28);
    });
  }catch(e){}
}

function playWrong(){
  try{
    const ctx=getAudioCtx();
    const now=ctx.currentTime;
    [[220,0,.18],[196,0.2,.18]].forEach(([f,t,dur])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sawtooth';o.frequency.value=f;
      g.gain.setValueAtTime(0,now+t);
      g.gain.linearRampToValueAtTime(0.18,now+t+0.03);
      g.gain.exponentialRampToValueAtTime(0.001,now+t+dur);
      o.start(now+t);o.stop(now+t+dur+0.05);
    });
  }catch(e){}
}

function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1))}

function genQuestion(usedDenoms){
  let denom,tries=0;
  do{denom=randInt(2,13);tries++;}while(usedDenoms.has(denom)&&tries<30);
  usedDenoms.add(denom);
  const whole=randInt(1,9);
  const numer=randInt(1,denom-1);
  const correctNumer=whole*denom+numer;
  const wrongs=new Set();
  let attempts=0;
  while(wrongs.size<3&&attempts<50){
    attempts++;
    const offset=randInt(1,8)*(Math.random()<0.5?1:-1);
    const w=correctNumer+offset;
    if(w>0&&w!==correctNumer)wrongs.add(w);
  }
  const choices=[correctNumer,...wrongs];
  for(let i=choices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[choices[i],choices[j]]=[choices[j],choices[i]];}
  return{whole,numer,denom,correctNumer,choices};
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startGame(){
  const usedDenoms=new Set();
  state={
    scores:[0,0,0,0],
    questions:ANIMALS.map(()=>genQuestion(usedDenoms)),
    locked:[false,false,false,false],
    timeLeft:TOTAL_SEC,
    usedDenoms,
    timerInterval:null
  };
  renderPlayers();
  showScreen('game-screen');
  runTimer();
}

function renderMixed(q){
  return`<span class="mixed-num">${q.whole}<span class="frac-stack"><span>${q.numer}</span><span class="frac-line"></span><span>${q.denom}</span></span></span>`;
}

function renderChoices(q,pi){
  return q.choices.map(c=>`<button class="choice-btn" onclick="answer(${pi},${c},${q.correctNumer})">${c}<span class="frac-stack" style="font-size:.75em;margin-left:2px"><span style="height:0;overflow:hidden">‾</span><span class="frac-line"></span><span>${q.denom}</span></span></button>`).join('');
}

function renderChoicesFrac(q,pi){
  return q.choices.map(c=>`<button class="choice-btn" onclick="answer(${pi},${c},${q.correctNumer})"><span style="display:inline-flex;align-items:center;gap:2px"><span style="font-size:1em;font-weight:900">${c}</span><span class="frac-stack" style="font-size:.65em"><span style="visibility:hidden">x</span><span class="frac-line"></span><span>${q.denom}</span></span></span></button>`).join('');
}

function renderPlayers(){
  const row=document.getElementById('players-row');
  row.innerHTML='';
  ANIMALS.forEach((a,i)=>{
    const q=state.questions[i];
    const div=document.createElement('div');
    div.className='player-panel '+a.cls;
    div.id='panel-'+i;
    div.innerHTML=`
      <div class="player-header">
        <span class="animal-emoji">${a.emoji}</span>
        <span class="animal-name">${a.name}</span>
        <span class="player-score" id="score-${i}">${state.scores[i]}점</span>
      </div>
      <div class="player-body" id="body-${i}">
        <div class="question-box" id="qbox-${i}">${renderMixed(q)}</div>
        <div class="choices" id="choices-${i}">${renderChoicesFrac(q,i)}</div>
      </div>`;
    row.appendChild(div);
  });
}

function answer(pi,chosen,correct){
  if(state.locked[pi])return;
  state.locked[pi]=true;
  const isCorrect=chosen===correct;
  state.scores[pi]+=isCorrect?10:-10;
  document.getElementById('score-'+pi).textContent=state.scores[pi]+'점';

  const panel=document.getElementById('panel-'+pi);
  panel.classList.remove('panel-flash-correct','panel-flash-wrong');
  void panel.offsetWidth;
  panel.classList.add(isCorrect?'panel-flash-correct':'panel-flash-wrong');

  if(isCorrect)playCorrect(); else playWrong();

  const btns=document.querySelectorAll('#choices-'+pi+' .choice-btn');
  btns.forEach(btn=>{
    const bVal=parseInt(btn.textContent);
    btn.classList.add('locked');
    if(bVal===correct)btn.classList.add('correct');
    else if(bVal===chosen&&!isCorrect)btn.classList.add('wrong');
  });

  setTimeout(()=>{
    if(state.timeLeft>0){
      state.locked[pi]=false;
      panel.classList.remove('panel-flash-correct','panel-flash-wrong');
      const usedDenoms=new Set(state.questions.filter((_,idx)=>idx!==pi).map(q=>q.denom));
      state.questions[pi]=genQuestion(usedDenoms);
      document.getElementById('qbox-'+pi).innerHTML=renderMixed(state.questions[pi]);
      document.getElementById('choices-'+pi).innerHTML=renderChoicesFrac(state.questions[pi],pi);
    }
  },800);
}

function runTimer(){
  updateTimerUI();
  state.timerInterval=setInterval(()=>{
    state.timeLeft--;
    updateTimerUI();
    if(state.timeLeft<=0){clearInterval(state.timerInterval);endGame();}
  },1000);
}

function updateTimerUI(){
  const t=state.timeLeft;
  const m=Math.floor(t/60);
  const s=(t%60).toString().padStart(2,'0');
  document.getElementById('timer-text').textContent=m+':'+s;
  const fill=document.getElementById('timer-fill');
  fill.style.width=(t/TOTAL_SEC*100)+'%';
  fill.style.background=t>20?'#1D9E75':t>8?'#EF9F27':'#E24B4A';
  document.getElementById('timer-text').style.color=t<=8?'#E24B4A':'var(--text)';
}

function endGame(){
  state.locked=[true,true,true,true];
  const sorted=ANIMALS.map((a,i)=>({...a,score:state.scores[i]})).sort((a,b)=>b.score-a.score);
  const winner=sorted[0];
  const wc=COLORS[winner.idx];
  const wBox=document.getElementById('winner-box');
  wBox.style.cssText=`background:${wc[1]};border-color:${wc[0]};color:${wc[2]}`;
  const tied=sorted.filter(p=>p.score===winner.score);
  if(tied.length>1){
    wBox.innerHTML='🏆 공동 우승!<br>'+tied.map(p=>p.emoji+' '+p.name).join(' & ')+'<br><span style="font-size:.7em">'+winner.score+'점</span>';
  }else{
    wBox.innerHTML='🏆 우승!<br>'+winner.emoji+' '+winner.name+'<br><span style="font-size:.7em">'+winner.score+'점</span>';
  }
  const medals=['🥇','🥈','🥉','4️⃣'];
  document.getElementById('rankings').innerHTML=sorted.map((p,ri)=>`
    <div class="rank-row">
      <span class="rank-num">${medals[ri]}</span>
      <span class="rank-name">${p.emoji} ${p.name}</span>
      <span class="rank-score" style="color:${COLORS[p.idx][0]}">${p.score}점</span>
    </div>`).join('');
  showScreen('result-screen');
}

function goStart(){showScreen('start-screen');}
</script>
